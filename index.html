<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      background-color: #ffffff;
      background-image: 
        radial-gradient(at 12% 15%, rgba(0, 113, 227, 0.04) 0px, transparent 50%),
        radial-gradient(at 88% 85%, rgba(52, 199, 89, 0.04) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(88, 86, 214, 0.03) 0px, transparent 60%);
      background-attachment: fixed;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
    }

    /* Apple Liquid Glass Container */
    .apple-glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.08), 0 1px 2px 0 rgba(0, 0, 0, 0.04);
    }

    .apple-input {
      background: rgba(0, 0, 0, 0.035);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #1d1d1f;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .apple-input:focus {
      background: #ffffff;
      border-color: #0071E3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
      outline: none;
    }

    .item-row {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.06);
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .item-row:hover {
      background: #ffffff;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.05);
    }

    .item-row.ticked {
      background: rgba(0, 0, 0, 0.02);
      border-color: rgba(0, 0, 0, 0.04);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

  <!-- Main Card -->
  <main class="apple-glass w-full max-w-md rounded-[28px] p-6 sm:p-7 flex flex-col gap-6">
    
    <!-- Header -->
    <header class="flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-[#FF5F56] inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-[#FFBD2E] inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-[#27C93F] inline-block"></span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-[#1D1D1F] mt-3">Shopping List</h1>
        <p id="statusSubtitle" class="text-xs font-medium text-[#86868B] mt-0.5">0 items</p>
      </div>
      
      <!-- Progress Ring / Pill -->
      <div class="px-3 py-1.5 rounded-full bg-black/[0.04] border border-black/[0.06] text-xs font-semibold text-[#1D1D1F]/80">
        <span id="progressText">0 / 0</span>
      </div>
    </header>

    <!-- Progress Bar -->
    <div class="w-full h-1.5 bg-black/[0.06] rounded-full overflow-hidden">
      <div id="progressBar" class="h-full bg-[#34C759] transition-all duration-300 ease-out w-0"></div>
    </div>

    <!-- Add Item Form -->
    <form id="addForm" class="flex gap-2" autocomplete="off">
      <input 
        id="itemName" 
        type="text" 
        placeholder="Add an item (e.g., Milk)..." 
        required
        class="apple-input flex-1 rounded-2xl px-4 py-3 text-sm text-[#1D1D1F] placeholder-[#86868B]"
      />
      <input 
        id="itemQty" 
        type="number" 
        min="1" 
        max="999" 
        value="1" 
        required
        aria-label="Quantity"
        class="apple-input w-20 rounded-2xl px-3 py-3 text-sm text-center font-semibold text-[#1D1D1F]"
      />
      <button 
        type="submit" 
        class="bg-[#0071E3] hover:bg-[#0077ED] active:scale-95 transition-all text-white font-semibold rounded-2xl px-4 py-3 text-sm shadow-md shadow-[#0071E3]/25 flex items-center justify-center"
        aria-label="Add item"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </form>

    <!-- Shopping List Container -->
    <section class="flex flex-col">
      <ul id="listContainer" class="flex flex-col gap-2.5 max-h-[360px] overflow-y-auto pr-1">
        <!-- Rendered dynamically by JS -->
      </ul>

      <!-- Empty State -->
      <div id="emptyState" class="hidden py-10 text-center flex-col items-center justify-center">
        <div class="w-12 h-12 rounded-2xl bg-black/[0.03] border border-black/[0.06] flex items-center justify-center mx-auto mb-3 text-[#86868B]">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
          </svg>
        </div>
        <p class="text-sm font-medium text-[#1D1D1F]">Your list is empty</p>
        <p class="text-xs text-[#86868B] mt-1">Add items and quantities above to begin.</p>
      </div>
    </section>

    <!-- Action Footer -->
    <footer class="pt-3 border-t border-black/[0.08] flex flex-col sm:flex-row gap-2.5">
      <!-- Clear Ticked Button -->
      <button 
        id="clearTickedBtn" 
        type="button"
        disabled
        class="flex-1 py-3 px-4 rounded-2xl text-xs font-semibold bg-[#FF3B30]/10 hover:bg-[#FF3B30]/15 text-[#FF3B30] border border-[#FF3B30]/20 transition-all active:scale-[0.98] disabled:opacity-35 disabled:pointer-events-none flex items-center justify-center gap-1.5"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span id="clearTickedText">Clear ticked</span>
      </button>

      <!-- Stretch Goal: Copy for WhatsApp -->
      <button 
        id="copyWhatsappBtn" 
        type="button"
        disabled
        class="flex-1 py-3 px-4 rounded-2xl text-xs font-semibold bg-[#34C759]/10 hover:bg-[#34C759]/20 text-[#248A3D] border border-[#34C759]/25 transition-all active:scale-[0.98] disabled:opacity-35 disabled:pointer-events-none flex items-center justify-center gap-1.5"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span id="copyBtnText">Copy for WhatsApp</span>
      </button>
    </footer>

  </main>

  <script>
    const STORAGE_KEY = 'metabox_shopping_list_v1';

    // Application State
    let items = [];

    // DOM Elements
    const addForm = document.getElementById('addForm');
    const itemNameInput = document.getElementById('itemName');
    const itemQtyInput = document.getElementById('itemQty');
    const listContainer = document.getElementById('listContainer');
    const emptyState = document.getElementById('emptyState');
    const clearTickedBtn = document.getElementById('clearTickedBtn');
    const clearTickedText = document.getElementById('clearTickedText');
    const copyWhatsappBtn = document.getElementById('copyWhatsappBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const statusSubtitle = document.getElementById('statusSubtitle');
    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');

    // Load items from localStorage safely
    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            items = parsed;
          }
        }
      } catch (err) {
        console.error('Failed to read from localStorage:', err);
        items = [];
      }
    }

    // Save items to localStorage
    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (err) {
        console.error('Failed to save to localStorage:', err);
      }
    }

    // Return items with unticked at the top and ticked moved to the bottom
    function getSortedItems() {
      return [...items].sort((a, b) => {
        if (a.ticked !== b.ticked) {
          return a.ticked ? 1 : -1; // Unticked (false) first, Ticked (true) at bottom
        }
        return a.createdAt - b.createdAt; // Preserve original insertion order within each group
      });
    }

    // Escape HTML to prevent XSS
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Render UI
    function render() {
      const sorted = getSortedItems();
      listContainer.innerHTML = '';

      if (sorted.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');

        sorted.forEach(item => {
          const li = document.createElement('li');
          li.className = `item-row rounded-2xl px-4 py-3 flex items-center justify-between gap-3 cursor-pointer select-none ${item.ticked ? 'ticked' : ''}`;
          
          li.innerHTML = `
            <div class="flex items-center gap-3.5 min-w-0 flex-1" data-action="toggle" data-id="${item.id}">
              <!-- Apple Circular Checkbox -->
              <div class="w-5 h-5 rounded-full flex items-center justify-center transition-all flex-shrink-0 ${
                item.ticked 
                  ? 'bg-[#34C759] border-[#34C759] text-white' 
                  : 'border-2 border-[#86868B]/40 hover:border-[#0071E3]'
              }">
                ${item.ticked ? `
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                  </svg>
                ` : ''}
              </div>

              <!-- Item Name -->
              <span class="text-sm font-medium truncate transition-all ${
                item.ticked ? 'line-through text-[#86868B]' : 'text-[#1D1D1F]'
              }">
                ${escapeHTML(item.name)}
              </span>
            </div>

            <!-- Quantity Controls & Badge -->
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <button 
                type="button" 
                data-action="decrement" 
                data-id="${item.id}"
                class="w-6 h-6 rounded-full bg-black/[0.04] hover:bg-black/[0.08] text-[#1D1D1F]/70 flex items-center justify-center text-xs font-bold transition-colors"
                title="Decrease quantity"
              >−</button>
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold min-w-[2.25rem] text-center ${
                item.ticked 
                  ? 'bg-black/[0.04] text-[#86868B]' 
                  : 'bg-[#0071E3]/10 text-[#0071E3] border border-[#0071E3]/20'
              }">
                ×${item.quantity}
              </span>
              <button 
                type="button" 
                data-action="increment" 
                data-id="${item.id}"
                class="w-6 h-6 rounded-full bg-black/[0.04] hover:bg-black/[0.08] text-[#1D1D1F]/70 flex items-center justify-center text-xs font-bold transition-colors"
                title="Increase quantity"
              >+</button>
            </div>
          `;

          listContainer.appendChild(li);
        });
      }

      // Update Counters & Progress
      const total = items.length;
      const tickedCount = items.filter(i => i.ticked).length;
      const remainingCount = total - tickedCount;

      statusSubtitle.textContent = total === 0 
        ? 'No items on your list' 
        : remainingCount === 0 
          ? 'All items picked up!' 
          : `${remainingCount} item${remainingCount === 1 ? '' : 's'} remaining`;

      progressText.textContent = `${tickedCount} / ${total}`;
      const percent = total > 0 ? Math.round((tickedCount / total) * 100) : 0;
      progressBar.style.width = `${percent}%`;

      // Update Buttons
      clearTickedBtn.disabled = tickedCount === 0;
      clearTickedText.textContent = tickedCount > 0 ? `Clear ticked (${tickedCount})` : 'Clear ticked';
      copyWhatsappBtn.disabled = total === 0;
    }

    // Add Item Handler
    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = itemNameInput.value.trim();
      const qty = parseInt(itemQtyInput.value, 10);

      if (!name || isNaN(qty) || qty < 1) return;

      // Check if an unticked item with the exact same name exists; if so, add to its quantity
      const existing = items.find(i => i.name.toLowerCase() === name.toLowerCase() && !i.ticked);
      if (existing) {
        existing.quantity += qty;
      } else {
        items.push({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          name,
          quantity: qty,
          ticked: false,
          createdAt: Date.now()
        });
      }

      saveToStorage();
      render();

      itemNameInput.value = '';
      itemQtyInput.value = '1';
      itemNameInput.focus();
    });

    // Delegate Clicks Inside List Container (Toggle, Increment, Decrement)
    listContainer.addEventListener('click', (e) => {
      const actionEl = e.target.closest('[data-action]');
      const rowEl = e.target.closest('li');
      
      let action = actionEl ? actionEl.dataset.action : null;
      let id = actionEl ? actionEl.dataset.id : null;

      // Allow clicking anywhere on the row (outside +/- buttons) to toggle
      if (!action && rowEl) {
        const toggleDiv = rowEl.querySelector('[data-action="toggle"]');
        if (toggleDiv) {
          action = 'toggle';
          id = toggleDiv.dataset.id;
        }
      }

      if (!action || !id) return;

      const targetItem = items.find(i => i.id === id);
      if (!targetItem) return;

      if (action === 'toggle') {
        targetItem.ticked = !targetItem.ticked;
      } else if (action === 'increment') {
        targetItem.quantity += 1;
      } else if (action === 'decrement') {
        if (targetItem.quantity > 1) {
          targetItem.quantity -= 1;
        } else {
          // Remove if decremented below 1
          items = items.filter(i => i.id !== id);
        }
      }

      saveToStorage();
      render();
    });

    // Clear Ticked Handler
    clearTickedBtn.addEventListener('click', () => {
      items = items.filter(i => !i.ticked);
      saveToStorage();
      render();
    });

    // Stretch Goal: Copy in WhatsApp-friendly format
    copyWhatsappBtn.addEventListener('click', async () => {
      if (items.length === 0) return;

      const unticked = items.filter(i => !i.ticked);
      const ticked = items.filter(i => i.ticked);

      const lines = ['🛒 *Shopping List*'];

      if (unticked.length > 0) {
        lines.push('');
        lines.push('*To Buy:*');
        unticked.forEach(i => {
          lines.push(`• ${i.quantity}x ${i.name}`);
        });
      }

      if (ticked.length > 0) {
        lines.push('');
        lines.push('*Picked Up:*');
        ticked.forEach(i => {
          lines.push(`• ~${i.quantity}x ${i.name}~`);
        });
      }

      const whatsappText = lines.join('\n');

      try {
        await navigator.clipboard.writeText(whatsappText);
        const originalText = copyBtnText.textContent;
        copyBtnText.textContent = 'Copied! ✓';
        setTimeout(() => {
          copyBtnText.textContent = originalText;
        }, 2000);
      } catch (err) {
        alert('Could not copy automatically:\n\n' + whatsappText);
      }
    });

    // Initialize App
    loadFromStorage();
    render();
  </script>
</body>
</html>

</html>
